{% assign cover = site.data.publication_covers[post.slug] %}
<button type="button" class="cv-work" data-cv-work="{{ forloop.index0 }}" aria-haspopup="dialog" aria-label="取阅：{{ post.title | escape }} / Read: {{ post.title_en | default: post.title | escape }}"><span class="cv-work__face"><span class="cv-work__image">{% if cover.image %}{% if cover.kind == 'book-original' %}<span class="publication-volume publication-volume--book" style="{{ cover.shape_style }}">{% endif %}<img draggable="false" src="{{ cover.image | relative_url }}" alt="" width="400" height="600" loading="lazy" decoding="async">{% if cover.kind == 'book-original' %}</span>{% endif %}{% else %}<span class="cv-work__record">{{ post.date | date: '%Y' }}<br><span data-i18n="zh">{{ cover.short_title | default: post.title }}</span><span data-i18n="en">{{ cover.short_title_en | default: post.title_en }}</span></span>{% endif %}</span><span class="cv-work__title"><span data-i18n="zh">{{ post.title }}</span><span data-i18n="en">{{ post.title_en | default: post.title }}</span></span><small>{{ post.date | date: '%Y' }} · <span data-i18n="zh">{% if cover.kind == 'book-original' %}著作原封面{% elsif cover.kind == 'original' %}期刊原封面{% elsif cover.image %}主题创作{% else %}著作资料卡{% endif %}</span><span data-i18n="en">{% if cover.kind == 'book-original' %}Book cover{% elsif cover.kind == 'original' %}Issue cover{% elsif cover.image %}Cover artwork{% else %}Book record{% endif %}</span></small></span></button>
<template data-cv-work-detail="{{ forloop.index0 }}"><div class="cv-work-reading"><div class="cv-work-reading__cover">{% if cover.image %}{% if cover.kind == 'book-original' %}<span class="publication-volume publication-volume--book" style="{{ cover.shape_style }}">{% endif %}<img draggable="false" src="{{ cover.image | relative_url }}" alt="{{ post.title | escape }}" width="400" height="600">{% if cover.kind == 'book-original' %}</span>{% endif %}{% endif %}<p><span data-i18n="zh">{% if cover.kind == 'book-original' %}本人提供的著作封面{% elsif cover.kind == 'original' %}已核对卷期的期刊原封面{% elsif cover.image %}依据论文主题生成的艺术封面{% else %}著作资料卡{% endif %}</span><span data-i18n="en">{% if cover.kind == 'book-original' %}Book cover supplied by the owner{% elsif cover.kind == 'original' %}Original issue cover, verified{% elsif cover.image %}AI-generated thematic artwork{% else %}Book record{% endif %}</span></p></div><article><h2 id="cv-work-title"><span data-i18n="zh">{{ post.title }}</span><span data-i18n="en">{{ post.title_en | default: post.title }}</span></h2><p class="cv-work-reading__venue">{{ post.date | date: '%Y' }} · <span data-i18n="zh">{{ post.venue }}</span><span data-i18n="en">{{ post.venue_en | default: post.venue }}</span></p><div>{{ post.content | markdownify }}</div>{% if post.citation %}<p class="cv-work-reading__citation">{{ post.citation }}</p>{% endif %}<div class="cv-work-reading__actions">{% if post.paperurl %}<a href="{{ post.paperurl }}"><i class="fa-regular fa-file-pdf" aria-hidden="true"></i><span data-i18n="zh">全文 PDF</span><span data-i18n="en">Full text PDF</span></a>{% endif %}{% if post.citation %}<button type="button" data-copy-citation="{{ post.citation | strip_html | escape }}"><span data-i18n="zh">复制引用</span><span data-i18n="en">Copy citation</span></button>{% endif %}<a href="{{ post.url | relative_url }}"><span data-i18n="zh">原始条目</span><span data-i18n="en">Source record</span><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a></div></article></div></template>
